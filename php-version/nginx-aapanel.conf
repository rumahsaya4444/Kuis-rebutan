# ========================================================
# KONFIGURASI NGINX DI AAPANEL UNTUK KILATQUIZ
# Tempelkan di menu: Website -> Klik Domain -> Config
# ========================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name kuis.domainanda.com;
    index index.html index.php;
    root /www/wwwroot/kilatquiz/public;

    # SSL sertifikat otomatis oleh Let's Encrypt aaPanel
    # ssl_certificate    /www/server/panel/vhost/cert/kuis.domainanda.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/kuis.domainanda.com/privkey.pem;

    # 1. Routing WebSocket (/ws) ke PHP WebSocket Server port 8080
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Routing PHP-FPM untuk REST API
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock; # Sesuaikan versi PHP di aaPanel (misal PHP 8.1 / 8.2 / 8.3)
        fastcgi_index index.php;
        include fastcgi.conf;
    }

    # 3. Static SPA Files (Frontend React / HTML5)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|mp4|webm)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }
}
